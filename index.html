<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anurag Singh · who's visiting?</title>
  <meta name="description" content="Anurag Singh, CSE at IIT Gandhinagar. Pick a path: the work side or the personal side.">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Kalam:wght@300;400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Courier+Prime&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-root="./" data-page="chooser">
  <main class="chooser">
    <span class="route">anurag singh · cse @ iit gandhinagar</span>
    <h1>Hi! Who's visiting?</h1>
    <svg class="post" id="post" viewBox="0 0 760 430" role="group" aria-label="A signpost with two paths"></svg>
    <p class="hand muted">Pick a sign. You can always switch paths later.</p>
  </main>

  <script src="assets/vendor/rough.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/sketch.js"></script>
  <script>
  (function(){
    var K=Sketch, s=K.$("post");
    // ground + post
    for(var i=0;i<22;i++){ var x=150+i*22; K.S(s,"linearPath",[[[x,418],[x+5,402],[x+10,418]]],{sw:1.2,rough:1.6,seed:40+i}); }
    K.S(s,"line",[470,420,472,50],{sw:5,seed:3});
    K.S(s,"circle",[471,46,14],{fill:true,fillStyle:"solid",seed:4});

    function sign(opts){
      var a=K.E("a",{href:K.link(opts.href),"aria-label":opts.aria},s);
      var g=K.E("g",{},a);
      var draw=function(seed){
        g.innerHTML="";
        K.S(g,"polygon",[opts.pts],{fill:true,noStroke:true,color:opts.color,seed:seed+1,angle:opts.angle});
        var ink=K.S(g,"polygon",[opts.pts],{sw:2.4,seed:seed}); ink.setAttribute("class","arrow-ink");
        K.T(g,opts.tx,opts.ty,opts.text,{size:26,weight:700});
        K.T(g,opts.tx,opts.ty+30,opts.sub,{size:16});
      };
      var seed=opts.seed; draw(seed);
      a.addEventListener("pointerenter",function(){ if(!K.reduce){ seed=Math.floor(Math.random()*1e5); draw(seed);} g.setAttribute("transform","translate("+opts.nudge+" 0)"); });
      a.addEventListener("pointerleave",function(){ g.removeAttribute("transform"); });
      a.addEventListener("focus",function(){ g.setAttribute("transform","translate("+opts.nudge+" 0)"); });
      a.addEventListener("blur",function(){ g.removeAttribute("transform"); });
    }
    sign({href:"hello/",aria:"Just here to say hi: the personal side",pts:[[458,80],[160,80],[118,125],[160,170],[458,170]],color:"sage",tx:300,ty:128,text:"just here to say hi",sub:"principles, ideas, the long walk",seed:10,nudge:-8,angle:-41});
    sign({href:"work/",aria:"Hiring or reviewing: the work side",pts:[[484,200],[700,200],[742,245],[700,290],[484,290]],color:"peach",tx:606,ty:248,text:"hiring / reviewing",sub:"research, projects, skills",seed:20,nudge:8,angle:40});

    K.avatar(s,220,248,1.05,{wave:!K.reduce,smile:true,seed:500});
    K.T(s,90,60,"that's me",{size:22,color:"red",rotate:-8});
    K.S(s,"path",["M70 72 C 90 120, 130 160, 170 190"],{color:"red",sw:1.6,seed:77});
  })();
  </script>
</body>
</html>
