<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anurag Singh · skills</title>
  <meta name="description" content="Anurag Singh's technical skills, grouped by area, each linked to the projects that used it.">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Kalam:wght@300;400;700&family=Delius&family=Courier+Prime&display=swap">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body data-root="../../" data-page="skills">
  <header id="nav"></header>
  <main class="shell">
    <section class="page-head">
      <span class="route">/work/skills/</span>
      <h1>Skills</h1>
      <p>Grouped by area. Next to each skill are the projects where I actually used it, so you can check the evidence.</p>
    </section>

    <section class="skill-groups" id="groups" aria-label="Skills by area"></section>

    <section class="stack" aria-labelledby="courses-h">
      <h2 id="courses-h">Relevant coursework</h2>
      <div class="tags" id="courses"></div>
    </section>
  </main>
  <footer id="foot"></footer>

  <script src="../../assets/vendor/rough.js"></script>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/sketch.js"></script>
  <script>
  (function () {
    var K = Sketch, D = SITE, $ = K.$;
    var colors = ["peach", "sky", "sage", "peach", "sky"];
    D.skills.forEach(function (g, gi) {
      var box = K.el("div", "sheet skill-group");
      var h = K.el("h3", null, g.group);
      box.appendChild(h);
      g.items.forEach(function (sk) {
        var row = K.el("div", "skill-row");
        var name = K.el("span", "skill"); var chip = K.el("span", "tag " + colors[gi], sk.name); chip.style.fontSize = "16px";
        name.appendChild(chip);
        var ev = K.el("span", "evidence");
        if (sk.projects.length) {
          sk.projects.forEach(function (p) {
            if (p.page) { var a = K.el("a", null, p.short); a.href = K.link(p.page.split("#")[0]) + (p.page.indexOf("#") > -1 ? "#" + p.page.split("#")[1] : ""); ev.appendChild(a); }
            else ev.appendChild(K.el("span", null, p.short));
          });
        } else {
          ev.appendChild(K.el("em", null, sk.note || "coursework"));
        }
        row.append(name, ev);
        box.appendChild(row);
      });
      $("groups").appendChild(box);
    });

    var seen = {};
    D.domains.forEach(function (d) { d.courses.forEach(function (c) { if (!seen[c]) { seen[c] = 1; $("courses").appendChild(K.el("span", "tag " + (d.color === "sky" ? "" : d.color), c)); } }); });
  })();
  </script>
</body>
</html>
