<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anurag Singh · skills</title>
  <meta name="description" content="Anurag Singh's technical skills across deep learning, machine learning, systems, databases and web, each linked to the projects that used it.">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Kalam:wght@300;400;700&family=Delius&family=Courier+Prime&display=swap">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body data-root="../../" data-page="skills">
  <header id="nav"></header>
  <main class="shell">
    <section class="page-head">
      <span class="route">/work/skills/</span>
      <h1>Skills</h1>
      <p>The languages, frameworks and techniques I have worked with, grouped by area. Select any skill to see the projects where I have applied it.</p>
    </section>

    <section class="skills-layout" aria-label="Skills">
      <div class="sheet skill-groups" id="groups"></div>
      <aside class="sheet skill-detail wob" id="detail" aria-live="polite"></aside>
    </section>

    <section class="stack" aria-labelledby="courses-h">
      <h2 id="courses-h">Relevant coursework</h2>
      <div class="tags" id="courses"></div>
    </section>
  </main>
  <footer id="foot"></footer>

  <script src="../../assets/vendor/rough.js"></script>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/sketch.js"></script>
  <script>
  (function () {
    var K = Sketch, D = SITE, $ = K.$, chips = [];
    function href(p) { return K.link(p.page.split("#")[0]) + (p.page.indexOf("#") > -1 ? "#" + p.page.split("#")[1] : ""); }

    function show(sk, group, chip) {
      chips.forEach(function (c) { c.setAttribute("aria-pressed", c === chip ? "true" : "false"); });
      var d = $("detail"); d.innerHTML = "";
      d.appendChild(K.el("span", "route", group.group));
      d.appendChild(K.el("h2", null, sk.name));
      if (!sk.projects.length) { d.appendChild(K.el("p", "muted", sk.note || "Used in coursework.")); return; }
      var n = sk.projects.length;
      d.appendChild(K.el("p", "muted", "Applied in " + n + (n === 1 ? " project:" : " projects:")));
      var ul = K.el("ul");
      sk.projects.forEach(function (p) {
        var li = K.el("li");
        if (p.page) { var a = K.el("a", null, p.title); a.href = href(p); li.appendChild(a); }
        else if (p.domain === "algo") { var a2 = K.el("a", null, p.title); a2.href = D.profile.links.codeforces.url; a2.rel = "noopener"; li.appendChild(a2); }
        else li.appendChild(K.el("b", null, p.title));
        li.appendChild(K.el("span", null, p.one));
        ul.appendChild(li);
      });
      d.appendChild(ul);
    }

    var first = null;
    D.skills.forEach(function (g) {
      var box = K.el("div", "skill-group");
      box.appendChild(K.el("h3", null, g.group));
      var row = K.el("div", "skill-chips");
      g.items.forEach(function (sk) {
        var b = K.el("button", "skill-chip", sk.name); b.type = "button";
        b.style.setProperty("--hl", "var(--" + g.color + ")");
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", function () {
          show(sk, g, b);
          if (window.matchMedia("(max-width: 900px)").matches) $("detail").scrollIntoView({ behavior: K.reduce ? "auto" : "smooth", block: "nearest" });
        });
        chips.push(b); row.appendChild(b);
        if (sk.id === "pytorch") first = [sk, g, b];
      });
      box.appendChild(row);
      $("groups").appendChild(box);
    });
    if (first) show(first[0], first[1], first[2]);

    var seen = {};
    D.domains.forEach(function (d) { d.courses.forEach(function (c) { if (!seen[c]) { seen[c] = 1; $("courses").appendChild(K.el("span", "tag " + (d.color === "sky" ? "" : d.color), c)); } }); });
  })();
  </script>
</body>
</html>
